[project]
name = "eu-ai-act-rag"
version = "0.1.0"
description = "Production RAG service answering EU AI Act questions with article-level citations"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "Houssem Yousfi", email = "houssemyousfi1999@gmail.com" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.12",
    "fastembed>=0.9.0",
    "tiktoken>=0.14.0",
    "anthropic>=1.15.0",
    "ragas>=0.4.3",
    "langchain-community<0.4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiact"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
